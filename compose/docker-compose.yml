services:
  postgres:
    image: postgres:17
    profiles: ["core"]
    container_name: mercatus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mercatus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercatus}
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mercatus} -d ${POSTGRES_DB:-catalog}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
